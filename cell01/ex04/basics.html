<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basics</title>
    <style>
        body {
            background-color: pink;
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
        }
        
        .main-title {
            text-align: center;
            color: white;
            font-size: 5rem;
            margin-bottom: 60px;
        }

        .shops-wrapper {
            text-align: center;
            margin-bottom: 40px;
        }

        .shop-item {
            display: inline-block;
            width: 250px;
            margin: 0 30px;
        }

        .shop-item img {
            width: 100%;
            height: 120px;
            object-fit: contain;
            margin-bottom: 15px;
        }

        .shop-item a {
            display: block;
            font-size: 1.5rem;
            color: #333;
            text-decoration: none;
            font-weight: bold;
        }

        .shop-item a:hover {
            text-decoration: underline;
            color: #555;
        }

        hr {
            border: 0;
            border-top: 3px solid white;
            margin: 40px 0;
        }

        .footer-info {
            text-align: right;
            font-style: italic;
            font-family: monospace;
            font-size: 1.2rem;
            color: #333;
        }
    </style>
</head>
<body>

    <h1 class="main-title">☆ Awesome Stores ☆</h1>
    
    <div class="shops-wrapper">
        <div class="shop-item">
            <img src="https://upload.wikimedia.org/wikipedia/commons/f/fe/Shopee.svg" alt="Shopee">
            <a href="https://shopee.co.th" target="_blank">Visit Shopee</a>
        </div>
        
        <div class="shop-item">
            <img src="https://laz-img-cdn.alicdn.com/tfs/TB1PApewFT7gK0jSZFpXXaTkpXa-200-200.png" alt="Lazada">
            <a href="https://www.lazada.co.th" target="_blank">Visit Lazada</a>
        </div>
    </div>

    <hr>

    <div class="footer-info">
        &copy; Ikrt_Loign 2026
    </div>

</body>
</html>
