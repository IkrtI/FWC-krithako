<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>User Profile Card</title>
  <link rel="stylesheet" href="card.css">
</head>
<body>

  <div class="wrapper">
    <div class="title">User Profile Card</div>

    <div class="card">
      <!-- รูปโปรไฟล์ -->
      <img src="https://picsum.photos/280/280" alt="Profile Picture" class="profile-pic">

      <div class="content">
        <table class="info-table">
          <tr>
            <td class="name">student_42</td>
          </tr>
          <tr>
            <td class="subtitle">Level 1, Developer</td>
          </tr>
          <tr>
            <td class="location">Bangkok, Thailand</td>
          </tr>
        </table>

        <div class="icons">
          <a href="#"><img src="https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/instagram.svg" alt="Instagram"></a>
          <a href="#"><img src="https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/github.svg" alt="GitHub"></a>
          <a href="#"><img src="https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/x.svg" alt="X"></a>
        </div>
      </div>

      <!-- ปุ่ม Contact ที่คลิกได้ -->
      <button class="contact" onclick="alert('Contact clicked!')">Contact</button>
    </div>
  </div>

</body>
</html>
